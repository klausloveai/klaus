<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@500;600&family=Source+Code+Pro:wght@400;500&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap">

<style>
/* Lingtu Law design system v1，墨金变体 — ink ground, parchment type, gold as rule.
   中文为主：正文黑体 Noto Sans SC，标题宋体 Noto Serif SC，拉丁字与数字用 Source Sans 3（与思源黑体同族，等高数字），
   案号走 Source Code Pro（Klaus 2026-10-20 选 B）。Layout: 单栏 1180px；每节以 40px 金色细线起手。 */
/* 凌图 design system v1 的 token，原值照用：
   ink #1C1917 / parchment #F2EDE2 / paper #FFFDF8 / gold #C0A260 / deep gold #A8862F /
   hairline #E6DFD1 / input #DCD3C1 / muted edge #C9BFA9 / row tint #FAF6EC。
   金色只做 1px 细线、眉标与数字，绝不填面。 */
:root {
  --ground: #F2EDE2;
  --paper: #FFFDF8;
  --paper-tint: #FAF6EC;
  --ink: #1C1917;
  --ink-muted: #5B534B;
  --ink-faint: #6E655A;
  --accent: #C0A260;
  --accent-text: #A8862F;
  --hairline: #E6DFD1;
  --edge: #DCD3C1;
  --edge-muted: #C9BFA9;
  --alarm: #8C2F1E;
  --alarm-bg: #F6E8E3;
  --steady: #2F5440;
  --steady-bg: #E4EDE7;
  --hold: #6E5A18;
  --hold-bg: #F4EDD9;
  --shadow-1: 0 1px 2px rgba(28,25,23,.04);
  --shadow-2: 0 2px 8px rgba(28,25,23,.06);
  color-scheme: light;

  --f-display: "Source Sans 3", "Noto Sans SC", system-ui, sans-serif;
  --f-han:     "Noto Serif SC", "Songti SC", serif;
  --f-body:    "Source Sans 3", "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  --f-mono:    "Source Code Pro", "Noto Sans SC", ui-monospace, monospace;
}

* { box-sizing: border-box; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.8;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 96px; }
@media (min-width: 768px)  { .wrap { padding-inline: 36px; } }
@media (min-width: 1100px) { .wrap { padding-inline: 56px; } }
/* 英文专名与法律术语：行内不换行，略微压一点字重差 */
.en { font-family: var(--f-body); font-weight: 500; }

/* ---------- masthead ---------- */
.mast { padding-block: 22px 32px; border-bottom: 1px solid var(--hairline); }
.eyebrow {
  font-family: var(--f-body); font-size: 11px; font-weight: 600;
  letter-spacing: .24em; text-transform: uppercase; color: var(--accent-text);
  margin: 0 0 14px;
}
h1 {
  font-family: var(--f-display); font-weight: 600; font-size: clamp(30px, 4.4vw, 42px);
  line-height: 1.12; letter-spacing: .01em; margin: 0 0 6px; text-wrap: balance;
}
h1 i { font-style: normal; font-weight: 400; color: var(--ink-muted); }
.mast .sub {
  font-family: var(--f-body); font-size: 15px; font-weight: 400;
  color: var(--ink-muted); margin: 0 0 26px; letter-spacing: .02em; line-height: 1.6;
}
.docket { display: flex; flex-wrap: wrap; gap: 0 36px; margin: 0; padding: 0; }
.docket div { padding-block: 6px; }
.docket dt {
  font-family: var(--f-body); font-size: 11px; font-weight: 500; letter-spacing: .06em;
  color: var(--ink-faint); margin-bottom: 1px; line-height: 1.5;
}
.docket dd { margin: 0; font-family: var(--f-mono); font-size: 13px; color: var(--ink); line-height: 1.6; }

/* ---------- section scaffolding ---------- */
section { margin-top: 72px; }
@media (min-width: 768px)  { section { margin-top: 96px; } }
@media (min-width: 1100px) { section { margin-top: 104px; } }
.rule { width: 40px; height: 1px; background: var(--accent); margin-bottom: 16px; }
section { margin-top: 56px; }
@media (min-width: 768px) { section { margin-top: 64px; } }
@media (min-width: 1100px) { section { margin-top: 68px; } }
h2 {
  font-family: var(--f-han); font-weight: 500; font-size: 22px; letter-spacing: .05em;
  margin: 0; line-height: 1.45;
}
h2 small {
  display: block; font-family: var(--f-display); font-style: normal; font-weight: 400;
  font-size: 14px; letter-spacing: 0; color: var(--ink-muted); margin-top: 0;
}
.lede {
  font-size: 17px; line-height: 1.9; font-weight: 300;
  color: var(--ink-muted); max-width: 46em; margin: 22px 0 0;
}
.lede b { font-weight: 600; color: var(--ink); }
h3 {
  font-family: var(--f-han); font-size: 15px; font-weight: 500; letter-spacing: .06em;
  color: var(--ink); margin: 34px 0 0;
}

/* ---------- cards ---------- */
.card {
  background: var(--paper); border: 1px solid var(--hairline); border-radius: 4px;
  padding: 24px; box-shadow: var(--shadow-1); min-width: 0;
  transition: box-shadow .3s cubic-bezier(.4,0,.2,1);
}
.card:hover { box-shadow: var(--shadow-2); }
.grid { display: grid; gap: 12px; margin-top: 20px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(255px, 1fr)); }
.card > :first-child { margin-top: 0; }
.card > :last-child { margin-bottom: 0; }
.card h4 {
  font-family: var(--f-han); font-size: 15px; font-weight: 500; margin: 0 0 10px;
  letter-spacing: .04em; line-height: 1.55; color: var(--ink);
}
.card p { margin: 0 0 10px; font-size: 14px; line-height: 1.95; color: var(--ink-muted); }
.card p:last-child { margin-bottom: 0; }
.card b { color: var(--ink); font-weight: 600; }

/* ---------- deadline strip ---------- */
.deadlines { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(176px, 1fr)); margin-top: 24px; }
.dl {
  background: var(--paper); border: 1px solid var(--hairline); border-radius: 4px;
  padding: 18px 20px; box-shadow: var(--shadow-1); min-width: 0;
}
.dl.now { border-color: var(--accent); }
.dl .when { font-family: var(--f-mono); font-size: 13px; color: var(--ink-muted); }
.dl .count {
  font-family: var(--f-body); font-variant-numeric: lining-nums tabular-nums; font-weight: 500;
  font-size: 30px; line-height: 1.15; margin: 4px 0 3px; color: var(--ink);
}
.dl.now .count { color: var(--accent-text); }
.dl .count small { font-size: 13px; font-weight: 400; color: var(--ink-faint); margin-left: 4px; }
.dl .what { font-size: 13px; color: var(--ink-muted); line-height: 1.75; }

/* ---------- chips ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 2px;
  padding: 3px 9px; font-size: 12px; font-weight: 500; letter-spacing: .04em;
  font-family: var(--f-body); white-space: nowrap;
  border: 1px solid var(--edge); color: var(--ink-muted); background: transparent;
}
.chip::before { content: ""; width: 5px; height: 5px; border-radius: 999px; background: currentColor; }
.chip.done { color: var(--steady); border-color: var(--steady); background: var(--steady-bg); }
.chip.wait { color: var(--hold);   border-color: var(--hold);   background: var(--hold-bg); }
.chip.due  { color: var(--alarm);  border-color: var(--alarm);  background: var(--alarm-bg); }
.chip.plain::before { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }

/* ---------- tables ---------- */
.tw { overflow-x: auto; margin-top: 20px; border: 1px solid var(--hairline); border-radius: 4px; background: var(--paper); }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 600px; }
th {
  text-align: left; font-family: var(--f-han); font-size: 12px; font-weight: 500;
  letter-spacing: .08em; color: var(--ink-faint);
  padding: 13px 18px; border-bottom: 1px solid var(--hairline); white-space: nowrap;
  background: var(--paper-tint);
}
td { padding: 14px 18px; border-bottom: 1px solid var(--hairline); vertical-align: top; color: var(--ink-muted); line-height: 1.85; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--paper-tint); }
td.k { color: var(--ink); font-weight: 500; }
td.num, th.num { font-family: var(--f-mono); font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; font-size: 13px; }
td.money { font-family: var(--f-body); font-variant-numeric: lining-nums tabular-nums; text-align: right; white-space: nowrap; color: var(--ink); }
th.money { text-align: right; }
.mono { font-family: var(--f-mono); font-size: 13px; }
tfoot td { border-top: 1px solid var(--edge); font-weight: 600; color: var(--ink); background: var(--paper-tint); }

/* ---------- blockers ---------- */
.blockers { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(285px, 1fr)); margin-top: 20px; }
.bl { background: var(--paper); border: 1px solid var(--hairline); border-left: 1px solid var(--accent); border-radius: 4px; padding: 20px 22px; box-shadow: var(--shadow-1); min-width: 0; }
.bl .who {
  font-family: var(--f-han); font-size: 14px; font-weight: 500; letter-spacing: .08em;
  color: var(--accent-text); margin-bottom: 12px;
}
.bl ul { margin: 0; padding-left: 0; list-style: none; }
.bl li { font-size: 14px; line-height: 1.9; color: var(--ink-muted); padding-block: 9px; border-bottom: 1px solid var(--hairline); }
.bl li:last-child { border-bottom: 0; padding-bottom: 0; }
.bl li:first-child { padding-top: 0; }
.bl li b { color: var(--ink); font-weight: 600; }
/* 待办编号：三栏共用一套连续编号，Klaus 用号码点事（「办 9」）。金色等宽数字。 */
.bl li .n {
  font-family: var(--f-mono); font-size: 12px; font-weight: 500;
  color: var(--accent-text); margin-right: 9px;
}

/* ---------- blockers as rows（标准写法；上面的 .blockers/.bl 卡片为旧版，勿再新用） ---------- */
.bls { margin-top: 22px; }
.bls .grp {
  font-family: var(--f-han); font-size: 13px; font-weight: 500; letter-spacing: .1em;
  color: var(--accent-text); padding: 18px 0 10px;
}
.bls .grp:first-child { padding-top: 0; }
/* 每条一个纸面盒子 —— 行的节奏，但与羊皮纸底分开（Klaus 2026-10-14） */
.bls .it {
  display: flex; gap: 12px; align-items: baseline;
  background: var(--paper); border: 1px solid var(--hairline); border-radius: 4px;
  padding: 15px 18px; margin-bottom: 8px; box-shadow: var(--shadow-1);
  transition: box-shadow .3s cubic-bezier(.4,0,.2,1);
}
.bls .it:hover { box-shadow: var(--shadow-2); }
.bls .it:last-child { margin-bottom: 0; }
.bls .it .n {
  flex: 0 0 22px; font-family: var(--f-mono); font-size: 12px; font-weight: 500;
  color: var(--accent-text); text-align: right;
}
.bls .it .tx { flex: 1; min-width: 0; font-size: 14px; line-height: 1.9; color: var(--ink-muted); }
.bls .it .tx b { color: var(--ink); font-weight: 600; }

/* ---------- timeline ---------- */
.tl { margin-top: 20px; border-left: 1px solid var(--edge); padding-left: 0; list-style: none; }
.tl li { position: relative; padding: 0 0 0 24px; margin-bottom: 18px; }
.tl li::before {
  content: ""; position: absolute; left: -3.5px; top: 11px; width: 6px; height: 6px;
  border-radius: 999px; background: var(--edge-muted);
}
.tl li.mark::before { background: var(--accent); width: 7px; height: 7px; left: -4px; }
.tl li.future::before { background: transparent; border: 1px solid var(--edge-muted); }
.tl .d { font-family: var(--f-mono); font-size: 12px; color: var(--accent-text); }
.tl li.future .d { color: var(--ink-faint); }
.tl .t { font-size: 14px; color: var(--ink-muted); line-height: 1.85; }
.tl .t b { color: var(--ink); font-weight: 600; }

/* ---------- misc ---------- */
.note {
  border-left: 1px solid var(--accent); background: var(--paper); border-radius: 0 4px 4px 0;
  padding: 16px 20px; margin-top: 20px; font-size: 14px; line-height: 1.95; color: var(--ink-muted);
}
.note b { color: var(--ink); font-weight: 600; }
.calc {
  font-family: var(--f-mono); font-size: 12.5px; line-height: 2.2; color: var(--ink-muted);
  background: var(--paper); border: 1px solid var(--hairline); border-radius: 4px;
  padding: 16px 18px; margin-top: 18px; overflow-x: auto; white-space: nowrap;
}
.calc b { color: var(--ink); font-weight: 500; }
/* ---------- section fold（每节可折叠，summary 包 h2） ---------- */
/* 每节一块面板（Klaus 2026-10-14）：面板用 paper-tint，比羊皮纸底浅一级，
   正文不再直接压在底色上；面板内的卡片、表格、待办行、期限行仍是纯白 paper，
   于是「底 → 面板 → 卡片」三级一眼分得开。 */
.sec {
  background: var(--paper-tint); border: 1px solid var(--hairline); border-radius: 4px;
  padding: 22px 24px;
}
@media (max-width: 620px) { .sec { padding: 18px 16px; } }
.sec > summary {
  list-style: none; cursor: pointer; position: relative; padding-right: 30px;
}
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary h2 { margin: 0; }
.sec > summary::after {
  content: ""; position: absolute; right: 4px; top: 10px; width: 8px; height: 8px;
  border-right: 1px solid var(--edge-muted); border-bottom: 1px solid var(--edge-muted);
  transform: rotate(45deg); transition: transform .2s cubic-bezier(.4,0,.2,1);
}
.sec[open] > summary::after { transform: rotate(-135deg); }
.sec > summary:hover::after, .sec > summary:focus-visible::after { border-color: var(--accent); }
.sec > summary:focus-visible { outline: none; }
.sec > summary:hover h2 { color: var(--accent-text); }
.sec > *:last-child { margin-bottom: 0; }

/* ---------- deadlines as rows（标准写法；.deadlines 卡片为旧版，勿再新用） ---------- */
.dls { list-style: none; margin: 24px 0 0; padding: 0; }
/* 每条一个纸面盒子，与待办行同一套观感（Klaus 2026-10-14） */
.dls .dl {
  display: block; background: var(--paper);
  border: 1px solid var(--hairline); border-radius: 4px;
  padding: 15px 18px; margin-bottom: 8px; box-shadow: var(--shadow-1);
  transition: box-shadow .3s cubic-bezier(.4,0,.2,1);
}
.dls .dl:hover { box-shadow: var(--shadow-2); }
.dls .dl.now { border-color: var(--accent); }
.dls .dl:last-child { margin-bottom: 0; }
.dl-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; }
.dl-title {
  font-family: var(--f-han); font-size: 15px; font-weight: 500; letter-spacing: .03em;
  color: var(--ink); line-height: 1.55;
}
.dls .dl.now .dl-title { color: var(--accent-text); }
.dl-when { margin-left: auto; white-space: nowrap; font-family: var(--f-mono); font-size: 13px; color: var(--ink-faint); }
.dls .dl-when .count {
  display: inline; font-family: var(--f-body); font-variant-numeric: lining-nums tabular-nums;
  font-weight: 500; font-size: 15px; color: var(--ink); margin: 0 0 0 12px;
}
.dls .dl.now .dl-when .count { color: var(--accent-text); }
.dls .dl-when .count small { font-size: 12px; font-weight: 400; color: var(--ink-faint); margin-left: 3px; }
.dl-desc { margin: 8px 0 0; font-size: 14px; line-height: 1.85; color: var(--ink-muted); max-width: 64em; }
.dl-desc b { color: var(--ink); font-weight: 600; }
@media (max-width: 620px) { .dl-when { margin-left: 0; width: 100%; } }
.foot { margin-top: 72px; padding-top: 24px; border-top: 1px solid var(--hairline); font-size: 12.5px; color: var(--ink-faint); line-height: 2; }
.foot p { margin: 0 0 8px; }
a { color: var(--accent-text); text-underline-offset: 3px; }
a:focus-visible { outline: none; color: var(--ink); }
@media (max-width: 560px) { .docket { gap: 0 24px; } }
a.chip { text-decoration: none; }
a.chip:hover { border-color: var(--accent); color: var(--ink); }

/* ---------- v7：状态条（masthead 内，数字由脚本从正文实时算，不手写） ---------- */
.stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
  margin: 28px 0 0; border: 1px solid var(--hairline); border-radius: 4px;
  background: var(--paper); box-shadow: var(--shadow-1); overflow: hidden;
}
.stats > div { padding: 14px 18px; border-right: 1px solid var(--hairline); min-width: 0; }
.stats > div:last-child { border-right: 0; }
.stats dt { font-family: var(--f-han); font-size: 12px; letter-spacing: .08em; color: var(--ink-faint); line-height: 1.5; }
.stats dd {
  margin: 2px 0 0; font-family: var(--f-body); font-variant-numeric: lining-nums tabular-nums;
  font-size: 26px; font-weight: 500; line-height: 1.25; color: var(--ink);
}
.stats dd small { font-size: 12px; font-weight: 400; color: var(--ink-faint); margin-left: 3px; }
.stats dd.txt { font-family: var(--f-han); font-size: 16px; line-height: 1.6; padding-top: 6px; }
.stats .next dd { color: var(--accent-text); }
.stats .stat-sub { margin: 2px 0 0; font-size: 12px; line-height: 1.6; color: var(--ink-muted); }
@media (max-width: 620px) {
  .stats > div { border-right: 0; border-bottom: 1px solid var(--hairline); }
  .stats > div:last-child { border-bottom: 0; }
}

/* ---------- v7：诉讼路线图（masthead 内，一行轨道；分岔细节写进「案件现状」） ---------- */
.road {
  list-style: none; margin: 22px 0 0; padding: 26px 0 6px;
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(92px, 1fr);
  overflow-x: auto;
}
.road li { position: relative; padding-top: 22px; text-align: center; min-width: 0; }
/* 连线：从本节点中心画到下一个节点中心，1px */
.road li::after {
  content: ""; position: absolute; top: 5px; left: 50%; width: 100%; height: 1px;
  background: var(--edge);
}
.road li:last-child::after { display: none; }
.road li.done::after { background: var(--accent); }
/* 节点 */
.road li::before {
  content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 11px; height: 11px; border-radius: 999px; z-index: 1;
  background: var(--ground); border: 1px solid var(--edge-muted);
}
.road li.done::before { background: var(--accent-text); border-color: var(--accent-text); width: 9px; height: 9px; top: 1px; }
.road li.now::before { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ground), 0 0 0 4px var(--accent); }
.road li.maybe::before { border-style: dashed; }
.road .st { display: block; font-family: var(--f-han); font-size: 13px; line-height: 1.5; color: var(--ink-muted); padding-inline: 4px; }
.road li.done .st { color: var(--ink); }
.road li.now .st { color: var(--accent-text); font-weight: 500; }
.road li.maybe .st { color: var(--ink-faint); }
.road small { display: block; font-family: var(--f-mono); font-size: 11px; color: var(--ink-faint); line-height: 1.6; }
.road .here {
  position: absolute; top: -24px; left: 50%; transform: translateX(-50%); white-space: nowrap;
  font-size: 10px; font-weight: 600; letter-spacing: .2em; color: var(--accent-text);
}

/* ---------- v7：待办行的出处行（来源 · 负责 · 期限） ---------- */
.bls .it .meta {
  display: block; margin-top: 3px; font-size: 12px; line-height: 1.7;
  color: var(--ink-faint); letter-spacing: .02em;
}

/* ---------- v7：客户材料清单（待补 / 已收） ---------- */
.chk { list-style: none; margin: 0; padding: 0; }
.chk li {
  position: relative; padding: 8px 0 8px 20px; border-bottom: 1px solid var(--hairline);
  font-size: 14px; line-height: 1.8; color: var(--ink-muted);
}
.chk li:last-child { border-bottom: 0; padding-bottom: 0; }
.chk li:first-child { padding-top: 0; }
.chk li::before {
  content: ""; position: absolute; left: 2px; top: 15px; width: 7px; height: 7px; border-radius: 999px;
}
.chk li:first-child::before { top: 7px; }
.chk li.miss::before { border: 1px solid var(--alarm); }
.chk li.got::before { background: var(--steady); }
.chk li b { color: var(--ink); font-weight: 600; }
.chk li .mono { float: right; margin-left: 12px; color: var(--ink-faint); font-size: 12px; }

/* ---------- v7：每周收入堆叠柱（误工案才用；必须配明细表） ----------
   数据色四个，按此顺序固定分配，不轮换（dataviz 校验通过：明度带 / 彩度 / CVD / 正常视觉 / 对比度）。
   这是数据标记，不是界面填面 —— 「金色绝不填面」管的是界面，不管柱子。 */
.bars { margin: 22px 0 0; background: var(--paper); border: 1px solid var(--hairline); border-radius: 4px; padding: 18px 18px 12px; }

  "use strict";
  var MS = 86400000;
  function todayUTC() {
    var n = new Date();
    return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
  }
  function daysUntil(iso) {
    var p = iso.split("-");
    var t = Date.UTC(+p[0], +p[1] - 1, +p[2]);
    return Math.round((t - todayUTC()) / MS);
  }
  var nodes = document.querySelectorAll("[data-days]");
  for (var i = 0; i < nodes.length; i++) {
    var el = nodes[i];
    var d = daysUntil(el.getAttribute("data-days"));
    var label, unit;
    if (d > 0)        { label = String(d); unit = "天"; }
    else if (d === 0) { label = "今天";    unit = ""; }
    else              { label = String(-d); unit = "天前"; }
    el.innerHTML = label + (unit ? ' <small>' + unit + '</small>' : "");
    if (d < 0) {
      var card = el.closest(".dl");
      if (card) { card.classList.remove("now"); card.style.opacity = ".55"; }
    }
  }
  /* v7 状态条：全部从正文实时数，不手写 —— 正文改了，条子自动跟着对 */
  var since = document.querySelector("[data-since]");
  if (since) {
    var ds = -daysUntil(since.getAttribute("data-since"));
    since.innerHTML = ds + ' <small>天</small>';
  }
  function put(k, html) {
    var el = document.querySelector('[data-stat="' + k + '"]');
    if (el) el.innerHTML = html;
  }
  put("open", String(document.querySelectorAll(".bls .it, .todos .todo:not(.prev), .trow:not(.prev)").length) + ' <small>条</small>');
  var mailRows = document.querySelectorAll("[data-mail]");
  if (mailRows.length) {
    put("mail", String(document.querySelectorAll('[data-mail="pending"],[data-mail="transit"]').length) +
        ' <small>/ ' + mailRows.length + ' 封</small>');
  } else {
    var mb = document.querySelector('[data-stat-box="mail"]');
    if (mb) mb.parentNode.removeChild(mb);
  }
  var best = null, bestD = Infinity;
  var dls = document.querySelectorAll(".dls [data-days]");
  for (var j = 0; j < dls.length; j++) {
    var dd = daysUntil(dls[j].getAttribute("data-days"));
    if (dd >= 0 && dd < bestD) { bestD = dd; best = dls[j]; }
  }
  if (best) {
    put("next", bestD === 0 ? "今天" : bestD + ' <small>天</small>');
    var row = best.closest(".dl"), t = row && row.querySelector(".dl-title");
    if (t) put("next-what", t.textContent);
  }


  var ops = document.querySelectorAll("[data-opened]");
  for (var k = 0; k < ops.length; k++) {
    var dd2 = -daysUntil(ops[k].getAttribute("data-opened"));
    ops[k].textContent = dd2 <= 0 ? "今天" : dd2 + " 天前";
  }

  var tal = document.querySelector("[data-tally]");
  if (tal) {
    var cnt = {}, none = 0, rowsT = document.querySelectorAll("[data-who]");
    for (var r = 0; r < rowsT.length; r++) {
      var who = (rowsT[r].getAttribute("data-who") || "").trim();
      if (!who || who === "—") { none++; continue; }
      who.split("·").forEach(function (w) { w = w.trim(); if (w) cnt[w] = (cnt[w] || 0) + 1; });
    }
    var keys = Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; });
    var html = keys.map(function (k) { return "<span>" + k + "<b>" + cnt[k] + "</b></span>"; }).join("");
    if (none) html += '<span class="none">未注明<b>' + none + "</b></span>";
    tal.innerHTML = '<span>共<b>' + rowsT.length + "</b> 件</span>" + html;
  }

  var tabs = document.querySelectorAll(".tabs [data-tab]");
  function showTab(name) {
    for (var q = 0; q < tabs.length; q++) tabs[q].setAttribute("aria-selected", tabs[q].getAttribute("data-tab") === name ? "true" : "false");
    var ps = document.querySelectorAll("[data-panel]");
    for (var q2 = 0; q2 < ps.length; q2++) ps[q2].hidden = ps[q2].getAttribute("data-panel") !== name;
    try { localStorage.setItem("pi-task-tab", name); } catch (e) {}
  }
  for (var q3 = 0; q3 < tabs.length; q3++) tabs[q3].addEventListener("click", function () { showTab(this.getAttribute("data-tab")); });
  try { var saved = localStorage.getItem("pi-task-tab"); if (saved) showTab(saved); } catch (e) {}
  var f = document.getElementById("asof");
  if (f) {
    var n = new Date();
    f.textContent = "数据截至 " + n.getFullYear() + " 年 " + (n.getMonth() + 1) +
                    " 月 " + n.getDate() + " 日。";
  }
})();
</script>
